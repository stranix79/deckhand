<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Any tool</title>
<link rel="stylesheet" href="assets/keynote.css">
</head>
<body class="grid">
  <div>
    <div class="kicker in" style="--i:0">Photos, video, fonts, SVG</div>
    <h2 class="in" style="--i:1">Put anything in <code style="font-family:var(--mono);font-weight:400">assets/</code>.</h2>
  </div>
  <div class="tiles">
    <div class="tile wide in" style="--i:2;background-image:url(assets/photos/fjord.jpg)"></div>
    <div class="tile in" style="--i:3;background-image:url(assets/photos/valley.jpg)"></div>
    <div class="tile in" style="--i:4;background-image:url(assets/photos/tent.jpg)"></div>
    <div class="tile in" style="--i:5;background-image:url(assets/photos/waterfall.jpg)"></div>
    <div class="tile in" style="--i:6;background-image:url(assets/photos/jellyfish.jpg)"></div>
    <div class="tile wide in" style="--i:7;background-image:url(assets/photos/coast.jpg)"></div>
  </div>
  <div class="num">14</div>
</body>
</html>
