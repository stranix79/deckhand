<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your audience</title>
<link rel="stylesheet" href="assets/keynote.css">
</head>
<body class="split">
  <div class="photo" style="background-image:url(assets/photos/lioness.jpg)"></div>
  <div class="panel">
    <div class="kicker in" style="--i:0">The hub</div>
    <h2 class="in" style="--i:1">Your audience is watching.</h2>
    <p class="in" style="--i:2">With the hub, people outside the room follow live, the link stays up after the talk, and you get the numbers.</p>
    <ul>
      <li class="in" style="--i:3">How many were there</li>
      <li class="in" style="--i:4">Until which slide</li>
      <li class="in" style="--i:5">How long on each</li>
    </ul>
  </div>
  <div class="num">15</div>
</body>
</html>
