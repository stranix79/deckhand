<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Time to first slide</title>
<link rel="stylesheet" href="assets/keynote.css">
</head>
<body class="chart">
  <div class="kicker in" style="--i:0">A chart, drawn in SVG, animated in CSS</div>
  <h2 class="in" style="--i:1">Minutes from “done” to “presenting”.</h2>
  <svg viewBox="0 0 1728 640">
    <g class="bars">
      <rect class="bar" style="--i:0" x="80"  y="120" width="220" height="440"/>
      <rect class="bar" style="--i:1" x="420" y="240" width="220" height="320"/>
      <rect class="bar" style="--i:2" x="760" y="360" width="220" height="200"/>
      <rect class="bar" style="--i:3" x="1100" y="470" width="220" height="90"/>
      <rect class="bar hi" style="--i:4" x="1440" y="536" width="220" height="24"/>
    </g>
    <g class="val">
      <text class="val" x="190" y="95" text-anchor="middle">22</text>
      <text class="val" x="530" y="215" text-anchor="middle">16</text>
      <text class="val" x="870" y="335" text-anchor="middle">10</text>
      <text class="val" x="1210" y="445" text-anchor="middle">4</text>
      <text class="val" x="1550" y="511" text-anchor="middle">1</text>
    </g>
    <g>
      <text x="190" y="610" text-anchor="middle">Export to PDF</text>
      <text x="530" y="610" text-anchor="middle">Upload somewhere</text>
      <text x="870" y="610" text-anchor="middle">Find the clicker</text>
      <text x="1210" y="610" text-anchor="middle">Mirror the screen</text>
      <text x="1550" y="610" text-anchor="middle">deckhand present</text>
    </g>
  </svg>
  <div class="num">12</div>
</body>
</html>
