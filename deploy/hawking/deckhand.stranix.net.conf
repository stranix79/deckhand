# deckhand.stranix.net (app) + decks.deckhand.stranix.net (fichiers des decks,
# origine séparée) → deckhand_hub:8080 (compose stranix/deckhand).
#
# Rate limiting : 10 r/s par IP, burst 40 (pages, assets, QR). Les WebSockets
# (/ws/, /api/v1/relay/) ne sont pas limités en requêtes mais en connexions.

limit_req_zone $binary_remote_addr zone=deckhand:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=deckhand_login:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=deckhand_ws:10m;

map $http_upgrade $deckhand_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name deckhand.stranix.net decks.deckhand.stranix.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- app -------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name deckhand.stranix.net;

    ssl_certificate /etc/letsencrypt/live/deckhand.stranix.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deckhand.stranix.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_deckhand:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/deckhand.stranix.net.access.log;
    error_log  /var/log/nginx/deckhand.stranix.net.error.log warn;

    # Uploads de decks : 200 Mo + marge.
    client_max_body_size 210m;

    # WebSockets : écrans et relais du CLI. Longue durée, pas de buffering.
    location ~ ^/(ws/|api/v1/relay/) {
        limit_conn deckhand_ws 40;
        proxy_pass http://deckhand_hub:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $deckhand_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /login {
        limit_req zone=deckhand burst=40 nodelay;
        limit_req zone=deckhand_login burst=5 nodelay;
        proxy_pass http://deckhand_hub:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=deckhand burst=40 nodelay;
        proxy_pass http://deckhand_hub:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;   # uploads
    }
}

# --- deck files (separate origin, no cookies ever) --------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name decks.deckhand.stranix.net;

    ssl_certificate /etc/letsencrypt/live/deckhand.stranix.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deckhand.stranix.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/decks.deckhand.stranix.net.access.log;
    error_log  /var/log/nginx/decks.deckhand.stranix.net.error.log warn;

    location / {
        limit_req zone=deckhand burst=100 nodelay;
        proxy_pass http://deckhand_hub:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
