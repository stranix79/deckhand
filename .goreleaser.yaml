# goreleaser v2 — binaries for the five targets of the brief, checksums,
# changelog from commits. The Homebrew formula is maintained separately by
# scripts/update-tap.sh (it builds from source, no token needed here).
version: 2

project_name: deckhand

before:
  hooks:
    - go mod tidy

builds:
  - id: deckhand
    main: ./cmd/deckhand
    binary: deckhand
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/stranix79/deckhand/internal/version.Version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - internal/hub/LICENSE
      - README.md
      - docs/FORMAT.md
      - docs/CLI.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

# AUR package deckhand-bin, pushed on every tag. Needs the AUR_KEY secret
# (private SSH key of the AUR account); without it the upload is skipped
# and the release still goes through.
aurs:
  - name: deckhand-bin
    homepage: https://deckhand.show
    description: "Present a folder of HTML slides: a stage on the big screen, a remote on your phone, a live link for the audience"
    maintainers:
      - "Gilles Fauvie <hello at code79 dot com>"
    license: "MIT AND BUSL-1.1"
    provides: [deckhand]
    conflicts: [deckhand]
    private_key: '{{ index .Env "AUR_KEY" }}'
    git_url: "ssh://aur@aur.archlinux.org/deckhand-bin.git"
    skip_upload: '{{ if index .Env "AUR_KEY" }}auto{{ else }}true{{ end }}'
    commit_author:
      name: Gilles Fauvie
      email: 1789515+gfauvie@users.noreply.github.com
    package: |-
      install -Dm755 ./deckhand "${pkgdir}/usr/bin/deckhand"
      install -Dm644 ./LICENSE "${pkgdir}/usr/share/licenses/deckhand-bin/LICENSE"
      install -Dm644 ./internal/hub/LICENSE "${pkgdir}/usr/share/licenses/deckhand-bin/LICENSE-hub"
      install -Dm644 ./README.md "${pkgdir}/usr/share/doc/deckhand-bin/README.md"
      install -Dm644 ./docs/FORMAT.md "${pkgdir}/usr/share/doc/deckhand-bin/FORMAT.md"
      install -Dm644 ./docs/CLI.md "${pkgdir}/usr/share/doc/deckhand-bin/CLI.md"

release:
  github:
    owner: stranix79
    name: deckhand
  draft: false
  prerelease: auto
