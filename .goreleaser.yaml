# goreleaser v2 — binaries for the five targets of the brief, checksums,
# changelog from commits. The Homebrew formula is maintained separately by
# scripts/update-tap.sh (it builds from source, no token needed here).
version: 2

project_name: deckhand

before:
  hooks:
    - go mod tidy

builds:
  - id: deckhand
    main: ./cmd/deckhand
    binary: deckhand
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/stranix79/deckhand/internal/version.Version={{.Version}}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - LICENSE.hub
      - README.md
      - docs/FORMAT.md
      - docs/CLI.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: stranix79
    name: deckhand
  draft: false
  prerelease: auto
